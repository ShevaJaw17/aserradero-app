<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Pedidos</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/pedido-form"><ion-icon slot="icon-only" name="add"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [(ngModel)]="filtro">
      <ion-segment-button value="todos"><ion-label>Todos</ion-label></ion-segment-button>
      <ion-segment-button value="pendiente"><ion-label>Pend.</ion-label></ion-segment-button>
      <ion-segment-button value="en_proceso"><ion-label>Proceso</ion-label></ion-segment-button>
      <ion-segment-button value="entregado"><ion-label>Entregado</ion-label></ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    @for (p of lista; track p.id) {
      <ion-item-sliding>
        <ion-item>
          <ion-label>
            <h2>{{ p.numero }} · {{ p.cliente }} <ion-badge [color]="estadoColor(p.estado)">{{ estadoLabel(p.estado) }}</ion-badge></h2>
            <p>{{ p.items.length }} ítems · Total: {{ p.total | number:'1.2-2' }}</p>
            <p class="ion-text-muted">{{ p.fecha | date:'dd/MM/yyyy' }} · {{ p.telefono || '' }}</p>
          </ion-label>
        </ion-item>
        <ion-item-options side="end">
          <ion-item-option color="primary" [routerLink]="['/pedido-form']" [queryParams]="{id: p.id}">
            <ion-icon slot="icon-only" name="create"></ion-icon>
          </ion-item-option>
          <ion-item-option color="success" (click)="cambiarEstado(p, 'entregado')">
            <ion-icon slot="icon-only" name="checkmark"></ion-icon>
          </ion-item-option>
          <ion-item-option color="danger" (click)="eliminar(p)">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    } @empty {
      <ion-item><ion-label class="ion-text-center">Sin pedidos</ion-label></ion-item>
    }
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/pedido-form"><ion-icon name="add"></ion-icon></ion-fab-button>
  </ion-fab>
</ion-content>
