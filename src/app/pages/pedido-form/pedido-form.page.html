<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button defaultHref="/pedidos"></ion-back-button></ion-buttons>
    <ion-title>{{ id ? 'Editar' : 'Nuevo' }} pedido</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-label position="floating">Cliente *</ion-label>
        <ion-input formControlName="cliente" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Teléfono</ion-label>
        <ion-input formControlName="telefono" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Notas</ion-label>
        <ion-textarea formControlName="notas" rows="3"></ion-textarea>
      </ion-item>
    </ion-list>

    <ion-list>
      <ion-item>
        <ion-label position="floating">Producto *</ion-label>
        <ion-input [(ngModel)]="prodNombre" [ngModelOptions]="{standalone:true}" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Dimensiones</ion-label>
        <ion-input [(ngModel)]="prodDim" [ngModelOptions]="{standalone:true}" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Cantidad *</ion-label>
        <ion-input [(ngModel)]="prodCantidad" [ngModelOptions]="{standalone:true}" type="number"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Precio unitario *</ion-label>
        <ion-input [(ngModel)]="prodPrecio" [ngModelOptions]="{standalone:true}" type="number"></ion-input>
      </ion-item>
      <ion-button expand="block" (click)="agregarItem()">Agregar ítem</ion-button>
    </ion-list>

    <ion-list>
      <ion-item *ngFor="let it of items; let i = index">
        <ion-label>
          {{ it.producto }} {{ it.dimensiones }} — {{ it.cantidad }} x {{ it.precioUnitario }} = {{ it.subtotal }}
        </ion-label>
        <ion-button slot="end" color="danger" (click)="quitarItem(i)">Quitar</ion-button>
      </ion-item>
    </ion-list>

    <p>Total: {{ total }}</p>

    <ion-button expand="block" (click)="guardar()" [disabled]="form.invalid || items.length === 0">
      Guardar
    </ion-button>
  </form>
</ion-content>
