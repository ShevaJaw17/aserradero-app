<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Facturación</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/factura-form"><ion-icon slot="icon-only" name="add"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    @for (f of lista; track f.id) {
      <ion-item-sliding>
        <ion-item>
          <ion-label>
            <h2>{{ f.numero }} · {{ f.cliente }} <ion-badge [color]="estadoColor(f.estado)">{{ f.estado }}</ion-badge></h2>
            <p>Subtotal: {{ f.subtotal | number:'1.2-2' }} · IVA: {{ f.impuesto | number:'1.2-2' }}</p>
            <p><strong>Total: {{ f.total | number:'1.2-2' }}</strong> · {{ f.fecha | date:'dd/MM/yyyy' }}</p>
          </ion-label>
        </ion-item>
        <ion-item-options side="end">
          <ion-item-option color="primary" [routerLink]="['/factura-form']" [queryParams]="{id: f.id}">
            <ion-icon slot="icon-only" name="create"></ion-icon>
          </ion-item-option>
          <ion-item-option color="success" (click)="cambiarEstado(f, 'pagada')">
            <ion-icon slot="icon-only" name="checkmark"></ion-icon>
          </ion-item-option>
          <ion-item-option color="danger" (click)="eliminar(f)">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    } @empty {
      <ion-item><ion-label class="ion-text-center">Sin facturas</ion-label></ion-item>
    }
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/factura-form"><ion-icon name="add"></ion-icon></ion-fab-button>
  </ion-fab>
</ion-content>
