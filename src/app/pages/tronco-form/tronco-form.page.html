<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/troncos"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ id ? 'Editar' : 'Nuevo' }} tronco</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-label position="floating">Especie *</ion-label>
        <ion-input formControlName="especie" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Diámetro (cm) *</ion-label>
        <ion-input formControlName="diametroCm" type="number"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Longitud (m) *</ion-label>
        <ion-input formControlName="longitudM" type="number"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Volumen (m³)</ion-label>
        <ion-input formControlName="volumenM3" type="number"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Proveedor</ion-label>
        <ion-input formControlName="proveedor" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Ubicación</ion-label>
        <ion-input formControlName="ubicacion" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label>Estado</ion-label>
        <ion-select formControlName="estado">
          <ion-select-option value="en_patio">En patio</ion-select-option>
          <ion-select-option value="en_proceso">En proceso</ion-select-option>
          <ion-select-option value="procesado">Procesado</ion-select-option>
          <ion-select-option value="vendido">Vendido</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Notas</ion-label>
        <ion-textarea formControlName="notas" rows="3"></ion-textarea>
      </ion-item>
    </ion-list>

    <ion-button expand="block" (click)="guardar()" [disabled]="form.invalid">
      Guardar
    </ion-button>
  </form>
</ion-content>
